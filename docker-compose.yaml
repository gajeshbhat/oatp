services:
  jaeger:
    image: jaegertracing/jaeger:2.17.0
    container_name: oatp-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: oatp-qdrant
    ports:
      - "6333:6333"     # REST API
      - "6334:6334"     # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
